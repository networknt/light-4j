# This is the config file to replace the default config loader to a customized one.
# For example, load the config files from the config server instead of filesystem.
# The following dummy entry is just to prevent the warning message during startup.
dummy: dummyEntry
# For real config loader config, please follow the format below with your implementation.
# light-4j provides a DefaultConfigLoader that loads config files from the light-portal
# and fallback to local file systems for cached config files.
# The following is the config for the DefaultConfigLoader.
# configLoaderClass: com.networknt.server.DefaultConfigLoader
# Our Config Server uses published snapshots identified only by host, serviceId, and envTag.

# Host defaults to lightapi.net when it is omitted.
# host: lightapi.net
# serviceId is required when configServerUri is configured, except for legacy custom-server lookups below.
# serviceId: com.networknt.light-gateway-1.0.0
# envTag defaults to light-env and then dev when it is omitted.
# envTag: dev

# Deprecated lookup parameters: retained only for backward compatibility with custom
# Config Servers. Explicitly configured values are forwarded without a compatibility flag;
# legacy lookups may omit serviceId. Null or omitted parameters are not forwarded.
# New deployments should use host, serviceId, and envTag with published snapshots,
# rather than select configuration from a live database. Our Config Server does not
# use these legacy parameters. Legacy usage logs one warning per bootstrap/reload.
# productId: light-4j
# productVersion: 2.3.8
# apiId: example
# apiVersion: 1.0.0

# Indicate to the config server we prefer yaml format over json format. default is json.
# acceptHeader: application/yaml

# The connect timeout for bootstrap from the config server. Default is 2 seconds. If not set,
# The connectTimeout of client.yml will be used.
# connectTimeout: 2000

# The request timeout for bootstrap from the config server. Default is 3 seconds. If not set,
# The timeout of client.yml will be used.
# timeout: 3000
