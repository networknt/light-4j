name: Refresh promoted Jackson 3 qualifications
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      force_renewal:
        description: Verify registered dispatch with GITHUB_TOKEN even when proof is fresh
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: jackson3-qualification-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Requalify registered master commits at their fixed policy refs
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_EVENT: ${{ github.event_name }}
          FORCE_RENEWAL: ${{ inputs.force_renewal || false }}
        run: |
          case "$REFRESH_EVENT:$FORCE_RENEWAL" in
            schedule:*|workflow_dispatch:false)
              python3 scripts/refresh_jackson3_qualifications.py ;;
            workflow_dispatch:true)
              python3 scripts/refresh_jackson3_qualifications.py --force-renewal ;;
            *) echo "Unsupported refresh event/input" >&2; exit 1 ;;
          esac
