name: Jackson 3 source build
on:
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full candidate SHA for independent qualification; empty runs ordinary CI
        type: string
        default: ''
      source_refs:
        description: JSON map of prerequisite repository names to full commit SHAs
        type: string
        default: '{}'
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  policy-protection:
    if: github.event_name != 'workflow_dispatch' || inputs.source_sha == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify registered policy protection with workflow token
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/jackson3_promotion_gates.py
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.source_sha == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: consumer
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve prerequisite commits
        id: prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REFS: ${{ inputs.source_refs || '{}' }}
        shell: bash
        run: |
          python3 consumer/scripts/resolve_jackson3_prerequisites.py --output source-refs.json
          for repo in yaml-rule http-client; do
            ref=$(jq -r --arg repo "$repo" '.[$repo]' source-refs.json)
            echo "${repo//-/_}=$ref" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@v4
        with:
          repository: networknt/yaml-rule
          ref: ${{ steps.prerequisites.outputs.yaml_rule }}
          path: sources/yaml-rule
      - uses: actions/checkout@v4
        with:
          repository: networknt/http-client
          ref: ${{ steps.prerequisites.outputs.http_client }}
          path: sources/http-client
      - name: Record prerequisite commits
        shell: bash
        run: |
          for source in sources/*; do
            echo "$source $(git -C "$source" rev-parse HEAD)"
          done | tee source-commits.txt
          for source in sources/*; do
            printf '{"key":"%s","value":"%s"}\n' "${source##*/}" "$(git -C "$source" rev-parse HEAD)"
          done | jq -s from_entries | tee source-refs.json
      - name: Test artifact audit tooling
        run: python3 -m unittest discover -s consumer/scripts/tests -p 'test_jackson3*.py'
      - name: Build prerequisites from source and run full tests
        shell: bash
        env:
          JACKSON3_MAVEN_REPO: ${{ runner.temp }}/m2
          JACKSON3_YAML_RULE: ${{ github.workspace }}/sources/yaml-rule
          JACKSON3_HTTP_CLIENT: ${{ github.workspace }}/sources/http-client
        run: bash consumer/scripts/verify-jackson3-bootstrap.sh 2>&1 | tee source-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-build-reports
          path: |
            source-build.log
            source-commits.txt
            source-refs.json
            **/target/surefire-reports/**
  qualify:
    if: github.event_name == 'workflow_dispatch' && inputs.source_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      yaml_rule: ${{ steps.prerequisites.outputs.yaml_rule }}
      http_client: ${{ steps.prerequisites.outputs.http_client }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: policy
      - name: Validate candidate input
        env:
          CANDIDATE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve prerequisite commits using trusted policy
        id: prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REFS: ${{ inputs.source_refs }}
        run: |
          python3 policy/scripts/resolve_jackson3_prerequisites.py --output source-refs.json
          echo "yaml_rule=$(jq -r '.["yaml-rule"]' source-refs.json)" >> "$GITHUB_OUTPUT"
          echo "http_client=$(jq -r '.["http-client"]' source-refs.json)" >> "$GITHUB_OUTPUT"
      - name: Check out prerequisites at recorded SHAs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for repo in yaml-rule http-client; do
            gh repo clone "networknt/$repo" "sources/$repo" -- --no-checkout
            git -C "sources/$repo" checkout --detach "$(jq -r --arg repo "$repo" '.[$repo]' source-refs.json)"
          done
      - name: Test trusted qualification tooling
        run: python3 -m unittest discover -s policy/scripts/tests -p 'test_jackson3*.py'
      - name: Build prerequisites and test the full candidate reactor
        env:
          JACKSON3_MAVEN_REPO: ${{ runner.temp }}/m2
          JACKSON3_CORE_SOURCE: ${{ github.workspace }}/candidate
          JACKSON3_YAML_RULE: ${{ github.workspace }}/sources/yaml-rule
          JACKSON3_HTTP_CLIENT: ${{ github.workspace }}/sources/http-client
        shell: bash
        run: bash policy/scripts/verify-jackson3-bootstrap.sh 2>&1 | tee source-build.log
      - name: Verify the actual tested source checkouts
        env:
          CANDIDATE_SHA: ${{ inputs.source_sha }}
          YAML_RULE_SHA: ${{ steps.prerequisites.outputs.yaml_rule }}
          HTTP_CLIENT_SHA: ${{ steps.prerequisites.outputs.http_client }}
        run: |
          verify_checkout() {
            local source=$1 expected=$2
            [[ "$(git -C "$source" rev-parse HEAD)" == "$expected" ]]
            [[ -z "$(git -C "$source" status --porcelain)" ]]
          }
          verify_checkout candidate "$CANDIDATE_SHA"
          verify_checkout sources/yaml-rule "$YAML_RULE_SHA"
          verify_checkout sources/http-client "$HTTP_CLIENT_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-reports-attempt-${{ github.run_attempt }}
          path: candidate/**/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-log-attempt-${{ github.run_attempt }}
          path: source-build.log
  record:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      # Fresh runner: candidate Maven plugins/tests cannot modify this recorder.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: policy
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: candidate-reports-attempt-${{ github.run_attempt }}
          path: candidate
      - name: Record qualification using trusted module inventory
        env:
          YAML_RULE_SHA: ${{ needs.qualify.outputs.yaml_rule }}
          HTTP_CLIENT_SHA: ${{ needs.qualify.outputs.http_client }}
        run: |
          jq -n --arg yaml "$YAML_RULE_SHA" --arg http "$HTTP_CLIENT_SHA" \
            '{"yaml-rule": $yaml, "http-client": $http}' > source-refs.json
          python3 policy/scripts/record_jackson3_core_evidence.py \
            --source candidate --refs source-refs.json --report core-source-qualification.json
      - uses: actions/upload-artifact@v4
        with:
          name: core-source-qualification-attempt-${{ github.run_attempt }}
          path: core-source-qualification.json
          if-no-files-found: error
          retention-days: 90
