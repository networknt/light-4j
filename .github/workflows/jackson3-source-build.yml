name: Jackson 3 source build
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: consumer
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve prerequisite pull requests or merged branches
        id: prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ref=$(gh api repos/networknt/yaml-rule/pulls/36 --jq 'if .merged then .base.ref elif .state == "open" then .head.sha else error("Prerequisite PR was closed without merging") end')
          echo "yaml_rule=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: networknt/yaml-rule
          ref: ${{ steps.prerequisites.outputs.yaml_rule }}
          path: sources/yaml-rule
      - uses: actions/checkout@v4
        with:
          repository: networknt/http-client
          ref: master
          path: sources/http-client
      - name: Record prerequisite commits
        shell: bash
        run: |
          for source in sources/*; do
            echo "$source $(git -C "$source" rev-parse HEAD)"
          done | tee source-commits.txt
      - name: Build prerequisites from source and run full tests
        shell: bash
        env:
          JACKSON3_MAVEN_REPO: ${{ runner.temp }}/m2
          JACKSON3_YAML_RULE: ${{ github.workspace }}/sources/yaml-rule
          JACKSON3_HTTP_CLIENT: ${{ github.workspace }}/sources/http-client
        run: bash consumer/scripts/verify-jackson3-bootstrap.sh 2>&1 | tee source-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-build-reports
          path: |
            source-build.log
            source-commits.txt
            **/target/surefire-reports/**
